<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifas el Paisa</title>
    <!-- Tailwind para el diseño web -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librería para generar la imagen de la rifa -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        .titulo-sombra { text-shadow: 3px 3px 0px rgba(0,0,0,0.2); }
        .boleta { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-pink-50 min-h-screen p-4 md:p-8 font-sans relative">

    <div class="max-w-6xl mx-auto">
        <!-- Encabezado inspirado en la boleta -->
        <header class="text-center mb-6 bg-gradient-to-r from-pink-600 to-pink-500 text-white p-6 rounded-2xl shadow-lg border-4 border-pink-700">
            <h1 class="text-5xl md:text-7xl font-black italic tracking-wider uppercase titulo-sombra mb-2">
                Rifas el Paisa
            </h1>
            <p class="text-xl md:text-2xl font-bold uppercase tracking-widest text-pink-200">
                Sensacional Rifa
            </p>
            <p class="mt-2 text-lg">Selecciona los números vendidos para tacharlos</p>
        </header>

        <!-- Indicador de estado de conexión y respaldo -->
        <div id="estado-conexion" class="mb-6 p-3 rounded-xl text-center font-bold text-sm bg-yellow-100 text-yellow-800 border border-yellow-300">
            ⏳ Conectando con la base de datos...
        </div>

        <!-- Panel de Control, Búsqueda, Progreso y Botones -->
        <div class="bg-white p-6 rounded-2xl shadow-md mb-8 border border-pink-200">
            <div class="flex flex-col lg:flex-row justify-between items-center gap-4">
                <!-- Contadores numéricos -->
                <div class="flex gap-4 text-center w-full lg:w-auto justify-center">
                    <div class="bg-pink-100 p-4 rounded-xl border border-pink-200 w-28 md:w-32">
                        <p class="text-xs md:text-sm text-pink-600 font-bold uppercase">Disponibles</p>
                        <p id="contador-disponibles" class="text-2xl md:text-3xl font-black text-pink-700">...</p>
                    </div>
                    <div class="bg-gray-100 p-4 rounded-xl border border-gray-200 w-28 md:w-32">
                        <p class="text-xs md:text-sm text-gray-500 font-bold uppercase">Vendidas</p>
                        <p id="contador-vendidas" class="text-2xl md:text-3xl font-black text-gray-700">...</p>
                    </div>
                </div>
                
                <!-- Buscador -->
                <div class="w-full lg:w-1/4">
                    <input 
                        type="text" 
                        id="buscador" 
                        placeholder="Buscar boleta (ej. 015)..." 
                        class="w-full p-4 border-2 border-pink-300 rounded-xl focus:outline-none focus:border-pink-600 text-lg text-center font-bold shadow-sm"
                        maxlength="3"
                    >
                </div>

                <!-- Botones de acción -->
                <div class="flex flex-col sm:flex-row gap-3 w-full lg:w-auto">
                    <button id="btn-compartir" class="w-full sm:w-auto bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-5 rounded-xl shadow-lg border-b-4 border-green-700 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        Compartir Imagen
                    </button>

                    <button id="btn-descargar-copia" class="w-full sm:w-auto bg-pink-600 hover:bg-pink-700 text-white font-bold py-4 px-5 rounded-xl shadow-lg border-b-4 border-pink-800 active:border-b-0 active:translate-y-1 transition-all flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Descargar Copia
                    </button>
                </div>
            </div>

            <!-- Barra de progreso visual -->
            <div class="mt-8 w-full pt-6 border-t border-pink-100">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-sm font-black text-pink-700 uppercase tracking-wide">Progreso de Venta</span>
                    <span id="porcentaje-texto" class="text-3xl font-black text-pink-800">0%</span>
                </div>
                <div class="w-full bg-pink-100 rounded-full h-6 border-2 border-pink-200 overflow-hidden shadow-inner relative">
                    <div id="barra-progreso" class="bg-gradient-to-r from-pink-500 to-pink-600 h-full rounded-full transition-all duration-700 ease-out shadow-md" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Cuadrícula de 1000 Boletas -->
        <div id="cuadricula-boletas" class="grid grid-cols-5 sm:grid-cols-10 md:grid-cols-12 lg:grid-cols-[repeat(20,minmax(0,1fr))] gap-2">
            <!-- Las boletas se generan aquí -->
        </div>
    </div>

    <!-- ========================================================================= -->
    <!-- PLANTILLA OCULTA: Se usa exclusivamente para generar la imagen de WhatsApp -->
    <!-- ========================================================================= -->
    <div style="position: absolute; top: -20000px; left: -20000px;">
        <div id="zona-captura" style="display: none; width: 1080px; padding: 40px; background-color: #fdf2f8; font-family: sans-serif;">
            <div style="text-align: center; margin-bottom: 30px; background: linear-gradient(to right, #db2777, #ec4899); color: white; padding: 20px; border-radius: 16px; border: 4px solid #be185d;">
                <h1 style="font-size: 60px; font-weight: 900; font-style: italic; text-transform: uppercase; margin: 0; text-shadow: 3px 3px 0px rgba(0,0,0,0.2);">
                    Rifas el Paisa
                </h1>
                <p style="font-size: 30px; font-weight: bold; text-transform: uppercase; margin-top: 10px; color: #fbcfe8;">
                    Números Disponibles
                </p>
            </div>
            <!-- Grid de 25 columnas para que quepan las 1000 perfectamente -->
            <div id="grid-captura" style="display: grid; grid-template-columns: repeat(25, 1fr); gap: 6px;">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Lógica de la aplicación, Firebase y Triple Respaldo Automático -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getFirestore,
            doc,
            collection,
            addDoc,
            onSnapshot,
            setDoc,
            arrayUnion,
            arrayRemove,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCBIZ1qiiwfJCCjdfLSXef1ZWy0JZPtLBU",
            authDomain: "moto-taxi-el-paisa.firebaseapp.com",
            projectId: "moto-taxi-el-paisa",
            storageBucket: "moto-taxi-el-paisa.firebasestorage.app",
            messagingSenderId: "980097402449",
            appId: "1:980097402449:web:1cc347eb3336e07d055a70",
            measurementId: "G-LR0XQY8G0W"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rifaRef = doc(db, "rifas", "diciembre2026");
        const historialCol = collection(db, "rifas", "diciembre2026", "historial");

        let boletasVendidas = [];
        let datosCargados = false;
        let ultimaFirmaRespaldada = "";
        const totalBoletas = 1000;

        // DOM
        const contenedor = document.getElementById('cuadricula-boletas');
        const contadorDisponibles = document.getElementById('contador-disponibles');
        const contadorVendidas = document.getElementById('contador-vendidas');
        const buscador = document.getElementById('buscador');
        const porcentajeTexto = document.getElementById('porcentaje-texto');
        const barraProgreso = document.getElementById('barra-progreso');
        const estadoConexion = document.getElementById('estado-conexion');
        const btnCompartir = document.getElementById('btn-compartir');
        const btnDescargarCopia = document.getElementById('btn-descargar-copia');

        function obtenerFechaHoy() {
            const ahora = new Date();
            const anio = ahora.getFullYear();
            const mes = String(ahora.getMonth() + 1).padStart(2, '0');
            const dia = String(ahora.getDate()).padStart(2, '0');
            return `${anio}-${mes}-${dia}`;
        }

        function mostrarEstado(tipo, mensaje) {
            if (tipo === 'ok') {
                estadoConexion.className = "mb-6 p-3 rounded-xl text-center font-bold text-sm bg-green-100 text-green-800 border border-green-300";
            } else if (tipo === 'error') {
                estadoConexion.className = "mb-6 p-3 rounded-xl text-center font-bold text-sm bg-red-100 text-red-800 border border-red-300";
            } else {
                estadoConexion.className = "mb-6 p-3 rounded-xl text-center font-bold text-sm bg-yellow-100 text-yellow-800 border border-yellow-300";
            }
            estadoConexion.textContent = mensaje;
        }

        function inicializarCuadricula() {
            for (let i = 0; i < totalBoletas; i++) {
                const numero = i.toString().padStart(3, '0');
                const boton = document.createElement('button');
                boton.id = `boleta-${numero}`;
                boton.textContent = numero;
                boton.className = `boleta w-full py-2 sm:py-3 rounded-lg font-bold text-sm sm:text-lg border-b-4 focus:outline-none bg-pink-300 text-white border-pink-400 cursor-wait`;
                
                boton.addEventListener('click', () => alternarEstadoBoleta(numero));
                contenedor.appendChild(boton);
            }
        }

        function actualizarInterfaz() {
            const setVendidas = new Set(boletasVendidas);

            for (let i = 0; i < totalBoletas; i++) {
                const numero = i.toString().padStart(3, '0');
                const boton = document.getElementById(`boleta-${numero}`);
                
                if (setVendidas.has(numero)) {
                    boton.className = `boleta w-full py-2 sm:py-3 rounded-lg font-bold text-sm sm:text-lg border-b-2 bg-gray-200 text-gray-400 line-through border-gray-300`;
                } else {
                    boton.className = `boleta w-full py-2 sm:py-3 rounded-lg font-bold text-sm sm:text-lg border-b-4 cursor-pointer bg-pink-600 text-white border-pink-800 hover:bg-pink-500 hover:-translate-y-1 active:translate-y-0 active:border-b-0`;
                }
            }
            
            const vendidas = setVendidas.size;
            contadorVendidas.textContent = vendidas;
            contadorDisponibles.textContent = totalBoletas - vendidas;

            const porcentaje = (vendidas / totalBoletas) * 100;
            const porcentajeFormateado = porcentaje % 1 === 0 ? porcentaje : porcentaje.toFixed(1);
            porcentajeTexto.textContent = `${porcentajeFormateado}%`;
            barraProgreso.style.width = `${porcentaje}%`;
        }

        // =========================================================
        // RESPALDO AUTOMÁTICO DIARIO (Nube + Local)
        // Jamás guarda ni sobrescribe si la lista viene vacía
        // =========================================================
        async function ejecutarRespaldoAutomatico(lista) {
            const ordenadas = [...new Set(lista)].sort();
            if (ordenadas.length === 0) return;

            const firmaActual = ordenadas.join(",");
            if (firmaActual === ultimaFirmaRespaldada) return;
            ultimaFirmaRespaldada = firmaActual;

            const fechaHoy = obtenerFechaHoy();

            // 1. Copia automática en el dispositivo (localStorage)
            try {
                localStorage.setItem("respaldo_rifas_el_paisa", JSON.stringify({
                    rifa: "Rifas el Paisa - diciembre2026",
                    fecha: new Date().toLocaleString("es-CO"),
                    totalVendidas: ordenadas.length,
                    vendidas: ordenadas
                }));
            } catch (e) {
                console.warn("No se pudo guardar copia local:", e);
            }

            // 2. Copia automática diaria en Firebase (subcolección respaldos)
            try {
                const respaldoDiaRef = doc(db, "rifas", "diciembre2026", "respaldos", `dia_${fechaHoy}`);
                await setDoc(respaldoDiaRef, {
                    fecha: fechaHoy,
                    totalVendidas: ordenadas.length,
                    vendidas: ordenadas,
                    actualizadoTexto: new Date().toLocaleString("es-CO"),
                    actualizadoEn: serverTimestamp()
                }, { merge: true });

                const hora = new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
                mostrarEstado('ok', `🟢 Conectado con Firebase · Respaldo automático guardado (${hora})`);
            } catch (error) {
                console.error("Error en respaldo diario:", error);
            }
        }

        // BLINDADO: Solo agrega o quita el número tocado y registra el movimiento en el historial
        async function alternarEstadoBoleta(numero) {
            if (!datosCargados) {
                alert("Espera un momento mientras termina de cargar la conexión con Firebase.");
                return;
            }

            const yaEstabaVendida = boletasVendidas.includes(numero);

            if (yaEstabaVendida) {
                const confirmar = confirm(`¿Seguro que quieres desmarcar la boleta ${numero} y dejarla disponible otra vez?`);
                if (!confirmar) return;
            }

            try {
                if (yaEstabaVendida) {
                    await setDoc(rifaRef, { vendidas: arrayRemove(numero) }, { merge: true });
                } else {
                    await setDoc(rifaRef, { vendidas: arrayUnion(numero) }, { merge: true });
                }

                // 3. Registro imborrable del movimiento en la subcolección "historial"
                await addDoc(historialCol, {
                    numero: numero,
                    accion: yaEstabaVendida ? "desmarcada" : "vendida",
                    fechaTexto: new Date().toLocaleString("es-CO"),
                    creadoEn: serverTimestamp()
                });
            } catch (error) {
                console.error("Error guardando:", error);
                mostrarEstado('error', `🔴 No se pudo guardar la boleta ${numero}: ${error.code || error.message}`);
                alert(`No se pudo guardar en Firebase.\n\nError: ${error.code || error.message}\n\nRevisa las reglas de Firestore.`);
            }
        }

        function escucharFirebase() {
            onSnapshot(rifaRef, (docSnap) => {
                datosCargados = true;
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    boletasVendidas = Array.isArray(data.vendidas) ? data.vendidas : [];
                } else {
                    boletasVendidas = [];
                }

                actualizarInterfaz();
                mostrarEstado('ok', '🟢 Conectado y sincronizado en tiempo real con Firebase');

                // Dispara el respaldo automático diario y local
                ejecutarRespaldoAutomatico(boletasVendidas);
            }, (error) => {
                datosCargados = false;
                console.error("Error de Firebase:", error);
                mostrarEstado('error', `🔴 Error de Firebase (${error.code}): revisa las Reglas de Firestore`);
            });
        }

        // =========================================================
        // BOTÓN DESCARGAR COPIA MANUAL (.JSON)
        // =========================================================
        btnDescargarCopia.addEventListener('click', () => {
            if (!datosCargados) {
                alert("Espera a que carguen las boletas antes de descargar la copia.");
                return;
            }

            const ordenadas = [...new Set(boletasVendidas)].sort();
            const respaldo = {
                rifa: "Rifas el Paisa - diciembre2026",
                fechaDescarga: new Date().toLocaleString("es-CO"),
                totalVendidas: ordenadas.length,
                totalDisponibles: totalBoletas - ordenadas.length,
                vendidas: ordenadas
            };

            const blob = new Blob([JSON.stringify(respaldo, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `respaldo_rifas_el_paisa_${obtenerFechaHoy()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // =========================================================
        // FUNCIÓN PARA GENERAR Y COMPARTIR LA IMAGEN
        // =========================================================
        btnCompartir.addEventListener('click', async () => {
            if (!datosCargados) {
                alert("Espera a que la barra superior aparezca en verde antes de generar la imagen.");
                return;
            }

            const textoOriginal = btnCompartir.innerHTML;
            btnCompartir.innerHTML = '⏳ Preparando imagen...';
            btnCompartir.disabled = true;
            btnCompartir.classList.add('opacity-75');

            try {
                const gridCaptura = document.getElementById('grid-captura');
                gridCaptura.innerHTML = '';
                const setVendidas = new Set(boletasVendidas);
                
                for (let i = 0; i < totalBoletas; i++) {
                    const numero = i.toString().padStart(3, '0');
                    const div = document.createElement('div');
                    div.textContent = numero;
                    div.style.padding = '8px 4px';
                    div.style.textAlign = 'center';
                    div.style.fontWeight = 'bold';
                    div.style.borderRadius = '6px';
                    div.style.fontSize = '15px';

                    if (setVendidas.has(numero)) {
                        div.style.backgroundColor = '#e5e7eb';
                        div.style.color = '#9ca3af';
                        div.style.textDecoration = 'line-through';
                    } else {
                        div.style.backgroundColor = '#db2777';
                        div.style.color = 'white';
                        div.style.borderBottom = '3px solid #be185d';
                    }
                    gridCaptura.appendChild(div);
                }

                const zonaCaptura = document.getElementById('zona-captura');
                zonaCaptura.style.display = 'block';

                const canvas = await html2canvas(zonaCaptura, {
                    scale: 2,
                    backgroundColor: '#fdf2f8',
                    logging: false
                });

                zonaCaptura.style.display = 'none';

                canvas.toBlob(async (blob) => {
                    const file = new File([blob], 'rifas-disponibles.png', { type: 'image/png' });
                    
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                title: 'Rifas el Paisa',
                                text: '¡Mira los números que quedan disponibles!',
                                files: [file]
                            });
                        } catch (error) {
                            if (error.name !== 'AbortError') {
                                descargarImagen(blob);
                            }
                        }
                    } else {
                        descargarImagen(blob);
                    }
                }, 'image/png');

            } catch (error) {
                console.error('Error al generar la imagen:', error);
                alert('Hubo un error al crear la imagen.');
            } finally {
                btnCompartir.innerHTML = textoOriginal;
                btnCompartir.disabled = false;
                btnCompartir.classList.remove('opacity-75');
            }
        });

        function descargarImagen(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'boletas_disponibles.png';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        buscador.addEventListener('input', (e) => {
            const textoBuscado = e.target.value.trim();
            const botones = contenedor.querySelectorAll('button');
            
            botones.forEach(boton => {
                if (boton.textContent.includes(textoBuscado) || textoBuscado === "") {
                    boton.style.display = "block";
                } else {
                    boton.style.display = "none";
                }
            });
        });

        inicializarCuadricula();
        escucharFirebase();
    </script>
</body>
</html>
