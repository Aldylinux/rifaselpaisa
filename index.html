<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifas el Paisa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .titulo-sombra {
            text-shadow: 3px 3px 0px rgba(0,0,0,0.2);
        }
        .boleta { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-pink-50 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-6xl mx-auto">
        <!-- Encabezado inspirado en la boleta -->
        <header class="text-center mb-8 bg-gradient-to-r from-pink-600 to-pink-500 text-white p-6 rounded-2xl shadow-lg border-4 border-pink-700">
            <h1 class="text-5xl md:text-7xl font-black italic tracking-wider uppercase titulo-sombra mb-2">
                Rifas el Paisa
            </h1>
            <p class="text-xl md:text-2xl font-bold uppercase tracking-widest text-pink-200">
                Sensacional Rifa
            </p>
            <p class="mt-2 text-lg">Selecciona los números vendidos para tacharlos</p>
        </header>

        <!-- Panel de Control, Búsqueda y Progreso -->
        <div class="bg-white p-6 rounded-2xl shadow-md mb-8 border border-pink-200">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                <!-- Contadores numéricos -->
                <div class="flex gap-6 text-center w-full md:w-auto justify-center">
                    <div class="bg-pink-100 p-4 rounded-xl border border-pink-200 w-32">
                        <p class="text-sm text-pink-600 font-bold uppercase">Disponibles</p>
                        <p id="contador-disponibles" class="text-3xl font-black text-pink-700">1000</p>
                    </div>
                    <div class="bg-gray-100 p-4 rounded-xl border border-gray-200 w-32">
                        <p class="text-sm text-gray-500 font-bold uppercase">Vendidas</p>
                        <p id="contador-vendidas" class="text-3xl font-black text-gray-700">0</p>
                    </div>
                </div>
                
                <!-- Buscador -->
                <div class="w-full md:w-1/3">
                    <input 
                        type="text" 
                        id="buscador" 
                        placeholder="Buscar boleta (ej. 015)..." 
                        class="w-full p-4 border-2 border-pink-300 rounded-xl focus:outline-none focus:border-pink-600 text-lg text-center font-bold"
                        maxlength="3"
                    >
                </div>
            </div>

            <!-- NUEVO: Barra de progreso visual -->
            <div class="mt-8 w-full pt-6 border-t border-pink-100">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-sm font-black text-pink-700 uppercase tracking-wide">Progreso de Venta</span>
                    <span id="porcentaje-texto" class="text-3xl font-black text-pink-800">0%</span>
                </div>
                <div class="w-full bg-pink-100 rounded-full h-6 border-2 border-pink-200 overflow-hidden shadow-inner relative">
                    <div id="barra-progreso" class="bg-gradient-to-r from-pink-500 to-pink-600 h-full rounded-full transition-all duration-700 ease-out shadow-md" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Cuadrícula de 1000 Boletas -->
        <div id="cuadricula-boletas" class="grid grid-cols-5 md:grid-cols-10 lg:grid-cols-20 gap-2">
            <!-- Las boletas se generan aquí con JavaScript -->
        </div>
    </div>

    <!-- Lógica de la aplicación y conexión a Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // =========================================================
        // PEGA AQUÍ LA CONFIGURACIÓN DE TU FIREBASE
        // =========================================================
        const firebaseConfig = {
  apiKey: "AIzaSyCBIZ1qiiwfJCCjdfLSXef1ZWy0JZPtLBU",
  authDomain: "moto-taxi-el-paisa.firebaseapp.com",
  projectId: "moto-taxi-el-paisa",
  storageBucket: "moto-taxi-el-paisa.firebasestorage.app",
  messagingSenderId: "980097402449",
  appId: "1:980097402449:web:1cc347eb3336e07d055a70",
  measurementId: "G-LR0XQY8G0W"
};

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rifaRef = doc(db, "rifas", "diciembre2026");

        let boletasVendidas = [];
        const totalBoletas = 1000;

        // Elementos del DOM
        const contenedor = document.getElementById('cuadricula-boletas');
        const contadorDisponibles = document.getElementById('contador-disponibles');
        const contadorVendidas = document.getElementById('contador-vendidas');
        const buscador = document.getElementById('buscador');
        
        // Elementos del Progreso
        const porcentajeTexto = document.getElementById('porcentaje-texto');
        const barraProgreso = document.getElementById('barra-progreso');

        function inicializarCuadricula() {
            for (let i = 0; i < totalBoletas; i++) {
                const numero = i.toString().padStart(3, '0');
                
                const boton = document.createElement('button');
                boton.id = `boleta-${numero}`;
                boton.textContent = numero;
                boton.className = `boleta w-full py-3 rounded-lg font-bold text-lg border-b-4 focus:outline-none bg-pink-600 text-white border-pink-800 hover:bg-pink-500`;
                
                boton.addEventListener('click', () => {
                    alternarEstadoBoleta(numero);
                });

                contenedor.appendChild(boton);
            }
        }

        function actualizarInterfaz() {
            // Actualizar estilos de los botones
            for (let i = 0; i < totalBoletas; i++) {
                const numero = i.toString().padStart(3, '0');
                const boton = document.getElementById(`boleta-${numero}`);
                
                if (boletasVendidas.includes(numero)) {
                    boton.className = `boleta w-full py-3 rounded-lg font-bold text-lg border-b-2 bg-gray-200 text-gray-400 line-through border-gray-300`;
                } else {
                    boton.className = `boleta w-full py-3 rounded-lg font-bold text-lg border-b-4 cursor-pointer bg-pink-600 text-white border-pink-800 hover:bg-pink-500 hover:-translate-y-1 active:translate-y-0 active:border-b-0`;
                }
            }
            
            // Actualizar contadores numéricos
            const vendidas = boletasVendidas.length;
            contadorVendidas.textContent = vendidas;
            contadorDisponibles.textContent = totalBoletas - vendidas;

            // Actualizar barra de progreso (Cálculo del 0 al 100%)
            const porcentaje = (vendidas / totalBoletas) * 100;
            // Si tiene decimales, mostramos uno. Si es cerrado, mostramos entero (ej: 45.5% o 45%)
            const porcentajeFormateado = porcentaje % 1 === 0 ? porcentaje : porcentaje.toFixed(1);
            
            porcentajeTexto.textContent = `${porcentajeFormateado}%`;
            barraProgreso.style.width = `${porcentaje}%`;
        }

        async function alternarEstadoBoleta(numero) {
            if (boletasVendidas.includes(numero)) {
                boletasVendidas = boletasVendidas.filter(n => n !== numero);
            } else {
                boletasVendidas.push(numero);
            }

            try {
                await setDoc(rifaRef, { vendidas: boletasVendidas }, { merge: true });
            } catch (error) {
                console.error("Error al guardar en Firebase:", error);
                alert("Hubo un error al guardar. Revisa tu conexión y los permisos de Firebase.");
            }
        }

        function escucharFirebase() {
            onSnapshot(rifaRef, (docSnap) => {
                if (docSnap.exists()) {
                    boletasVendidas = docSnap.data().vendidas || [];
                } else {
                    setDoc(rifaRef, { vendidas: [] });
                }
                actualizarInterfaz();
            }, (error) => {
                console.error("Error al escuchar Firebase:", error);
            });
        }

        buscador.addEventListener('input', (e) => {
            const textoBuscado = e.target.value.trim();
            const botones = contenedor.querySelectorAll('button');
            
            botones.forEach(boton => {
                if (boton.textContent.includes(textoBuscado) || textoBuscado === "") {
                    boton.style.display = "block";
                } else {
                    boton.style.display = "none";
                }
            });
        });

        // Inicialización
        inicializarCuadricula();
        escucharFirebase();

    </script>
</body>
</html>
